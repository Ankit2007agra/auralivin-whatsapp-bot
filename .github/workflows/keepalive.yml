name: Keep Render service awake

# Pings the bot's /health endpoint every 10 minutes so Render's free tier
# never sits idle long enough to spin down. Render free web services sleep
# after ~15 minutes with no traffic, the next request then has to cold-start
# the server, which is slow and can wipe in-memory state (greeted numbers,
# human-handoff status, etc.) and cause WhatsApp to retry webhook deliveries.
# Keeping the server warm avoids all of that, for free.
#
# Note: GitHub automatically disables scheduled workflows on a repo that
# has had no commits for 60 days. If pings ever stop, just re-enable this
# workflow from the Actions tab (or push any small commit).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          curl -fsS --max-time 20 "https://auralivin-whatsapp-bot.onrender.com/health" \
            && echo "OK - service is awake" \
            || echo "Ping failed (server may be cold-starting) - not treated as a workflow failure"
